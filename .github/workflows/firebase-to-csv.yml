name: Firebase Feedback to CSV

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firebase-to-csv
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Python sync script
        env:
          PROJECT_ID: whiteout-svs-highsan-backend
        run: |
          python3 python/sync_firebase_feedback.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add post/csv/highsan3.csv post/i/

          if git diff --cached --quiet; then
            echo "CSV に変更はありません"
            exit 0
          fi

          git commit -m "Sync latest Firebase feedback to CSV"
          git push origin "HEAD:${GITHUB_REF_NAME}"

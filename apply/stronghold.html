<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stronghold&Fortress掲示板</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-top: 0;
        color: #1e3a8a;
        border-bottom: 3px solid #2563eb;
        padding-bottom: 10px;
      }

      .nickname-input {
        width: 100%;
        max-width: 420px;
        padding: 10px 12px;
        font-size: 14px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        margin: 8px 0 20px;
      }

      .nickname-input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 5px rgba(37, 99, 235, 0.3);
      }

      .section-title {
        margin: 12px 0 8px;
        font-weight: bold;
        color: #1e3a8a;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #f8fafc;
      }

      .checkbox-item input {
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .button-area {
        margin-top: 15px;
      }

      button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        transition: 0.2s;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        background: #cccccc;
        cursor: not-allowed;
      }

      .summary-section {
        margin-top: 32px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 12px;
        margin-top: 12px;
      }

      .summary-card {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 82px;
        padding: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f8fafc;
      }

      .summary-icon {
        font-size: 30px;
        line-height: 1;
      }

      .summary-name {
        color: #334155;
        font-size: 14px;
        font-weight: bold;
      }

      .summary-count {
        margin-top: 6px;
        color: #1d4ed8;
        font-size: 18px;
        font-weight: bold;
      }

      .summary-count span {
        margin-right: 4px;
        font-size: 16px;
      }

      .summary-status {
        margin-top: 12px;
        color: #64748b;
        font-size: 13px;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .container {
          padding: 20px;
        }

        .date-col {
          width: 90px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>📋 Stronghold&Fortress掲示板</h2>

      <label for="nickname"><strong>同盟コード</strong></label
      ><br />
      <input
        id="nickname"
        class="nickname-input"
        type="text"
        maxlength="40"
        placeholder="同盟コードを入力してください"
      />

      <div class="section-title">要塞（4か所）</div>
      <div id="fortCheckboxes" class="checkbox-grid"></div>

      <div class="section-title">砦（12か所）</div>
      <div id="strongholdCheckboxes" class="checkbox-grid"></div>

      <div class="button-area">
        <button id="sendBtn" onclick="saveMessage()">送信</button>
      </div>

      <div class="summary-section">
        <div class="section-title">📊 要塞・砦の申込状況</div>
        <div class="section-title">要塞（4か所）</div>
        <div id="fortSummary" class="summary-grid"></div>
        <div class="section-title" style="margin-top: 24px">砦（12か所）</div>
        <div id="strongholdSummary" class="summary-grid"></div>
        <div id="summaryStatus" class="summary-status">集計中...</div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDzMPb6IcHPtkpVyqcKKf9Wc9h77_axpV0",
        authDomain: "whiteout-stronghold.firebaseapp.com",
        projectId: "whiteout-stronghold",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const nicknameBox = document.getElementById("nickname");
      const fortCheckboxes = document.getElementById("fortCheckboxes");
      const strongholdCheckboxes = document.getElementById("strongholdCheckboxes");
      const fortSummary = document.getElementById("fortSummary");
      const strongholdSummary = document.getElementById("strongholdSummary");
      const summaryStatus = document.getElementById("summaryStatus");
      const sendBtn = document.getElementById("sendBtn");

      function createCheckboxes(container, prefix, count, groupName) {
        for (let i = 1; i <= count; i++) {
          const label = document.createElement("label");
          label.className = "checkbox-item";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.name = groupName;
          checkbox.value = `${prefix}${i}`;
          const text = document.createElement("span");
          text.textContent = `${prefix}${i}`;
          label.append(checkbox, text);
          container.appendChild(label);
        }
      }

      createCheckboxes(fortCheckboxes, "要塞", 4, "forts");
      createCheckboxes(strongholdCheckboxes, "砦", 12, "strongholds");

      function getCheckedValues(groupName) {
        return Array.from(document.querySelectorAll(`input[name="${groupName}"]:checked`))
          .map((checkbox) => checkbox.value);
      }

      window.saveMessage = async function () {
        const nickname = nicknameBox.value.trim();
        const forts = getCheckedValues("forts");
        const strongholds = getCheckedValues("strongholds");

        if (!nickname) {
          alert("同盟コードを入力してください。");
          nicknameBox.focus();
          return;
        }
        if (forts.length === 0 && strongholds.length === 0) {
          alert("要塞または砦を1つ以上選択してください。");
          return;
        }

        try {
          sendBtn.disabled = true;
          await addDoc(collection(db, "feedback"), {
            nickname,
            forts,
            strongholds,
            createdAt: new Date().toISOString(),
          });

          document.querySelectorAll('input[name="forts"], input[name="strongholds"]')
            .forEach((checkbox) => { checkbox.checked = false; });
          nicknameBox.value = "";
          await loadSummary();
          alert("申込を登録しました。");
        } catch (e) {
          console.error(e);
          alert("投稿に失敗しました。");
        } finally {
          sendBtn.disabled = false;
        }
      };

      function renderSummary(container, prefix, count, icon, counts) {
        container.innerHTML = "";
        for (let i = 1; i <= count; i++) {
          const name = `${prefix}${i}`;
          const card = document.createElement("div");
          card.className = "summary-card";
          const iconEl = document.createElement("div");
          iconEl.className = "summary-icon";
          iconEl.textContent = icon;
          const info = document.createElement("div");
          const nameEl = document.createElement("div");
          nameEl.className = "summary-name";
          nameEl.textContent = name;
          const countEl = document.createElement("div");
          countEl.className = "summary-count";
          const peopleIcon = document.createElement("span");
          peopleIcon.textContent = "👥";
          countEl.append(peopleIcon, document.createTextNode(`${counts[name] || 0} 件`));
          info.append(nameEl, countEl);
          card.append(iconEl, info);
          container.appendChild(card);
        }
      }

      async function loadSummary() {
        summaryStatus.textContent = "集計中...";
        try {
          // 全申込データを集計し、施設ごとの申込件数だけを表示
          const snapshot = await getDocs(collection(db, "feedback"));
          const fortCounts = {};
          const strongholdCounts = {};

          snapshot.forEach((doc) => {
            const data = doc.data();
            if (Array.isArray(data.forts)) {
              data.forts.forEach((name) => {
                fortCounts[name] = (fortCounts[name] || 0) + 1;
              });
            }
            if (Array.isArray(data.strongholds)) {
              data.strongholds.forEach((name) => {
                strongholdCounts[name] = (strongholdCounts[name] || 0) + 1;
              });
            }
          });

          renderSummary(fortSummary, "要塞", 4, "🏰", fortCounts);
          renderSummary(strongholdSummary, "砦", 12, "🛡️", strongholdCounts);
          summaryStatus.textContent = `全 ${snapshot.size} 件の申込データを集計しました。`;
        } catch (e) {
          console.error(e);
          summaryStatus.textContent = "集計データを取得できませんでした。";
        }
      }

      loadSummary();
    </script>
  </body>
</html>

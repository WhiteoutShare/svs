
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stronghold&Fortress掲示板</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
        background: #f4f7fb;
        margin: 0;
        padding: 30px;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      h2 {
        margin-top: 0;
        color: #1e3a8a;
        border-bottom: 3px solid #2563eb;
        padding-bottom: 10px;
      }

      .table-wrapper {
        margin-top: 20px;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: #2563eb;
        color: white;
        padding: 12px;
        text-align: center;
        white-space: nowrap;
      }

      td {
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
      }

      tbody tr:hover {
        background-color: #f8fafc;
      }

      .center {
        text-align: center;
      }

      .date-col {
        width: 180px;
        white-space: nowrap;
      }

      .selection-col {
        min-width: 180px;
        word-break: break-word;
      }

      .loading {
        text-align: center;
        color: #666;
        padding: 20px;
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        margin-bottom: 15px;
      }

      .pagination button {
        min-width: 90px;
        padding: 8px 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
      }

      .pagination button:hover:not(:disabled) {
        background: #1d4ed8;
      }

      .pagination button:disabled {
        background: #cccccc;
        cursor: not-allowed;
      }

      .page-info {
        min-width: 100px;
        text-align: center;
        color: #555;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .container {
          padding: 20px;
        }

        .date-col {
          width: 120px;
        }

        th,
        td {
          padding: 9px;
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>📋 Stronghold&Fortress掲示板</h2>

      <div class="table-wrapper">
        <div class="pagination">
          <button id="prevBtn" type="button">← 前のページ</button>
          <span id="pageInfo" class="page-info">第 1 页</span>
          <button id="nextBtn" type="button">次のページ →</button>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 50px">No</th>
              <th>同盟コード</th>
              <th>要塞（4か所）</th>
              <th>砦（12か所）</th>
              <th class="date-col">投稿日時</th>
            </tr>
          </thead>

          <tbody id="messageTable">
            <tr>
              <td colspan="5" class="loading">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

      import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        limit,
        startAfter,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDzMPb6IcHPtkpVyqcKKf9Wc9h77_axV0",
        authDomain: "whiteout-stronghold.firebaseapp.com",
        projectId: "whiteout-stronghold",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const PAGE_SIZE = 10;

      let currentPage = 1;
      let loading = false;
      let hasNextPage = false;

      // 已读取页面的缓存
      const pageCache = {};

      // 每页最后一条记录，用于游标分页
      const pageCursors = {};

      const tbody = document.getElementById("messageTable");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const pageInfo = document.getElementById("pageInfo");

      prevBtn.addEventListener("click", prevPage);
      nextBtn.addEventListener("click", nextPage);

      // 加载指定页面
      async function loadPage(page) {
        if (loading || page < 1) {
          return;
        }

        loading = true;
        prevBtn.disabled = true;
        nextBtn.disabled = true;

        try {
          // 优先使用缓存
          if (pageCache[page]) {
            renderPage(page, pageCache[page]);
            return;
          }

          const collectionRef = collection(db, "feedback");
          let q;

          if (page === 1) {
            q = query(
              collectionRef,
              orderBy("createdAt", "desc"),
              limit(PAGE_SIZE + 1),
            );
          } else {
            const lastDoc = pageCursors[page - 1];

            if (!lastDoc) {
              return;
            }

            q = query(
              collectionRef,
              orderBy("createdAt", "desc"),
              startAfter(lastDoc),
              limit(PAGE_SIZE + 1),
            );
          }

          showLoading();

          const snapshot = await getDocs(q);
          const docs = snapshot.docs;

          // 多读取一条，用于判断是否存在下一页
          hasNextPage = docs.length > PAGE_SIZE;
          const pageDocs = docs.slice(0, PAGE_SIZE);

          pageCache[page] = pageDocs;

          if (pageDocs.length > 0) {
            pageCursors[page] = pageDocs[pageDocs.length - 1];
          }

          renderPage(page, pageDocs);
        } catch (error) {
          console.error(error);

          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="center">
                データ取得エラー
              </td>
            </tr>
          `;

          pageInfo.textContent = "読み込みエラー";
          prevBtn.disabled = currentPage <= 1;
          nextBtn.disabled = true;
        } finally {
          loading = false;
        }
      }

      // 渲染表格
      function renderPage(page, docs) {
        tbody.innerHTML = "";

        if (docs.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="center">
                投稿はまだありません。
              </td>
            </tr>
          `;

          currentPage = page;
          hasNextPage = false;
          pageInfo.textContent = `第 ${page} 页`;
          prevBtn.disabled = page <= 1;
          nextBtn.disabled = true;
          return;
        }

        docs.forEach((doc, index) => {
          const data = doc.data();
          const tr = document.createElement("tr");

          const noTd = document.createElement("td");
          noTd.className = "center";
          noTd.textContent = (page - 1) * PAGE_SIZE + index + 1;

          const nicknameTd = document.createElement("td");
          nicknameTd.textContent = data.nickname ?? "";

          const fortsTd = document.createElement("td");
          fortsTd.className = "selection-col";
          fortsTd.textContent = Array.isArray(data.forts)
            ? data.forts.join("、")
            : "";

          const strongholdsTd = document.createElement("td");
          strongholdsTd.className = "selection-col";
          strongholdsTd.textContent = Array.isArray(data.strongholds)
            ? data.strongholds.join("、")
            : "";

          const dateTd = document.createElement("td");
          dateTd.className = "center date-col";

          if (data.createdAt) {
            const date = new Date(data.createdAt);

            dateTd.textContent = Number.isNaN(date.getTime())
              ? ""
              : date.toLocaleString("ja-JP", {
                  timeZone: "Asia/Tokyo",
                });
          }

          tr.append(
            noTd,
            nicknameTd,
            fortsTd,
            strongholdsTd,
            dateTd,
          );

          tbody.appendChild(tr);
        });

        currentPage = page;
        pageInfo.textContent = `第 ${page} 页`;

        prevBtn.disabled = page <= 1;
        nextBtn.disabled = !hasNextPage;
      }

      function showLoading() {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="loading">
              読み込み中...
            </td>
          </tr>
        `;
      }

      async function nextPage() {
        if (loading || !hasNextPage) {
          return;
        }

        await loadPage(currentPage + 1);
      }

      async function prevPage() {
        if (loading || currentPage <= 1) {
          return;
        }

        await loadPage(currentPage - 1);
      }

      // 初始化
      loadPage(1);
    </script>
  </body>
</html>
